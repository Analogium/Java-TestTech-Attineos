spring.application.name=books
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100

# Every error (400, 404, 405, 415...) answers the same RFC 9457 JSON: {type, title, status, detail, instance}
spring.mvc.problemdetails.enabled=true

# Strict JSON: a 400 rather than silently losing or guessing data
# ("publicationYear":"1965" or "title":1984 stay accepted: converting them loses nothing)
# "publicationYear":1965.9 is not truncated to 1965
spring.jackson.deserialization.accept-float-as-int=false
# {"title":"A","title":"B"}: which one did the client mean? Reject.
spring.jackson.read.strict-duplicate-detection=true
# A valid book is < 3 KB of JSON: don't let a client make us parse megabytes
spring.jackson.factory.constraints.read.max-document-length=10000
